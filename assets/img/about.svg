<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spot" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset="1" stop-color="#cfcfcc"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="700" height="700" fill="url(#spot)"/>
  <rect y="600" width="700" height="100" fill="#3c3c3c"/>
  <rect y="596" width="700" height="6" fill="#2a2a2a"/>
  <g stroke="#333" stroke-width="2" opacity=".6">
    <line x1="80" y1="602" x2="40" y2="700"/><line x1="250" y1="602" x2="230" y2="700"/>
    <line x1="450" y1="602" x2="470" y2="700"/><line x1="620" y1="602" x2="660" y2="700"/>
  </g>

  <!-- картина из цветовых блоков -->
  <g transform="translate(190 130)" filter="url(#sh)">
    <rect width="320" height="320" fill="#26272b"/>
    <rect x="18" y="18" width="284" height="284" fill="#f4f1ea"/>
    <rect x="18" y="18" width="142" height="180" fill="#e0805e"/>
    <rect x="164" y="18" width="138" height="88" fill="#6f7d90"/>
    <rect x="164" y="110" width="138" height="88" fill="#e6d3b3"/>
    <rect x="18" y="202" width="92" height="100" fill="#9aa77f"/>
    <rect x="114" y="202" width="188" height="100" fill="#4f93c4"/>
  </g>
</svg>
